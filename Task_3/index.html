<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <nav>
      <a href="#">Gmail</a>
      <a href="#">Images</a>
      <div class="icon grid"></div>
      <div class="icon profile"></div>
    </nav>
  </header>

  <main>
    <div class="logo">
      <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span
        class="green">l</span><span class="red">e</span>
    </div>

    <div class="search-container">
      <div class="search-bar">
        <span class="symbol">🔍</span>
        <input type="text" autofocus>
        <span class="symbol">🎙️</span>
      </div>

      <div class="buttons">
        <button>Google Search</button>
        <button>I'm Feeling Lucky</button>
      </div>

      <p class="languages">Google offered in: <a href="#">हिन्दी</a> <a href="#">বাংলা</a> <a href="#">తెలుగు</a></p>
    </div>
  </main>

  <footer>
    <div class="location">India</div>
    <div class="footer-links">
      <div class="link-group">
        <a href="#">About</a>
        <a href="#">Advertising</a>
        <a href="#">Business</a>
        <a href="#">How Search works</a>
      </div>
      <div class="link-group">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Settings</a>
      </div>
    </div>
  </footer>

</body>

</html>
